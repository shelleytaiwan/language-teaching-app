<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>語言老師的教學工具</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% -10%, #fffdf8 0%, #f6f4ef 55%);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .page {
      width: min(1120px, 100%);
      max-width: 1120px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 12px;
      color: #8e652f;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.22em;
    }

    h1 {
      font-size: clamp(40px, 6vw, 64px);
      letter-spacing: 0.04em;
      line-height: 1.2;
      font-weight: 800;
      margin: 0;
    }

    /* 刪除 subtitle 相關樣式，小字全部移除 */

    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 28px;
      margin-top: 8px;
    }

    .tool {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      padding: 32px 20px 28px;
      background: #ffffff;
      border: 1px solid #e6e1d8;
      border-radius: 32px;
      box-shadow: 0 12px 35px rgba(50, 42, 30, 0.08);
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      overflow: hidden;
    }

    .tool::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -60px;
      bottom: -60px;
      border-radius: 50%;
      background: rgba(184, 135, 70, 0.08);
      transition: transform 0.25s ease;
      pointer-events: none;
    }

    .tool:hover {
      transform: translateY(-6px);
      border-color: #d4bd9c;
      box-shadow: 0 18px 42px rgba(50, 42, 30, 0.13);
    }

    .tool:hover::after {
      transform: scale(1.25);
    }

    /* 圖標容器：放大 2 倍，置中 */
    .icon {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: #faf8f3;
      border: 1px solid #eee8dd;
      overflow: hidden;
      margin-bottom: 28px;
      flex-shrink: 0;
    }

    .icon img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
    }

    .icon-fallback {
      font-size: 80px;
      line-height: 1;
    }

    /* 只保留工具名稱，其他小字全刪除 */
    .tool-name {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
    }

    /* 移除 .tool-desc, .open, .subtitle 等所有說明文字 */
    .tool-desc,
    .open,
    .subtitle {
      display: none;
    }

    /* footer 保留但簡化，移除多餘文字 */
    footer {
      margin-top: 60px;
      text-align: center;
      color: #a09a91;
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 12px;
      }
      .tools {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .tool {
        min-height: 240px;
        padding: 28px 16px 24px;
      }
      .icon {
        width: 120px;
        height: 120px;
      }
      .icon img {
        width: 100px;
        height: 100px;
      }
      .icon-fallback {
        font-size: 66px;
      }
      .tool-name {
        font-size: 22px;
      }
      header {
        margin-bottom: 32px;
      }
      h1 {
        font-size: 36px;
      }
    }
  </style>
</head>
